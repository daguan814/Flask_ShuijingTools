<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水镜云盘管理</title><link rel="stylesheet" href="/admin/admin.css?v=1"></head><body><main>
<section id="login" class="login"><h1>管理员登录</h1><form id="loginForm"><input id="adminName" placeholder="管理员账号" required><input id="adminPassword" type="password" placeholder="管理员密码" required><button>登录</button></form><p id="loginError"></p><a href="/">返回学生云盘</a></section>
<section id="app" class="hidden"><header><div><h1>水镜云盘管理</h1><p>班级、学生、文件、公告与汇报</p></div><a href="/">学生端</a></header><nav><button data-view="students" class="active">学生管理</button><button data-view="classes">班级管理</button><button data-view="requests">注册审核</button><button data-view="files">班级文件</button><button data-view="recycle">回收站</button><button data-view="messages">消息</button></nav><p id="notice"></p>
<section id="students" class="view"><div class="title"><h2>学生管理</h2></div><div class="warning">删除学生是高风险操作：必须输入学生姓名确认。账号会停用，学生文件夹将移入统一回收站。</div><div class="table"><table><thead><tr><th>班级</th><th>姓名</th><th>状态</th><th>已用空间</th><th>操作</th></tr></thead><tbody id="studentRows"></tbody></table></div></section>
<section id="classes" class="view hidden"><div class="title"><h2>班级管理</h2><button id="addClass">新增班级</button></div><div class="table"><table><thead><tr><th>班级名</th><th>目录</th><th>操作</th></tr></thead><tbody id="classRows"></tbody></table></div></section>
<section id="requests" class="view hidden"><h2>注册审核</h2><div class="table"><table><thead><tr><th>班级</th><th>姓名</th><th>申请时间</th><th>操作</th></tr></thead><tbody id="requestRows"></tbody></table></div></section>
<section id="files" class="view hidden"><div class="title"><h2>班级文件</h2><select id="studentSelect"></select></div><div class="file-tools"><button id="uploadBtn">上传文件</button><button id="mkdirBtn">新建文件夹</button><button id="upBtn">返回上级</button><span id="pathLabel">/</span></div><input id="uploadInput" type="file" multiple hidden><div class="table"><table><thead><tr><th>名称</th><th>类型</th><th>内容</th><th>大小</th><th>操作</th></tr></thead><tbody id="fileRows"></tbody></table></div></section>
<section id="recycle" class="view hidden"><h2>统一回收站</h2><div class="table"><table><thead><tr><th>班级</th><th>学生</th><th>原位置</th><th>删除时间</th><th>操作</th></tr></thead><tbody id="recycleRows"></tbody></table></div></section>
<section id="messages" class="view hidden"><div class="message-grid"><div><h2>发布班级公告</h2><form id="announcementForm"><select id="announcementClass"></select><input id="announcementTitle" placeholder="公告标题" required><textarea id="announcementContent" placeholder="公告内容" required></textarea><button>发布公告</button></form></div><div><h2>学生汇报</h2><div id="reportList"></div></div></div></section>
</section></main><script src="/admin/admin.js?v=1"></script></body></html>
